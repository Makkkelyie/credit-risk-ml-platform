name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Synthetic data only: ingest checks, dbt build + data tests, feature parity,
      # promotion gate, PSI, and the scoring API.
      - run: pytest -q
